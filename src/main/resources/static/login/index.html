<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../reset.css" rel="stylesheet" />
    <link href="../global.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <a href="/"><img src="../img/signiture.svg" /></a>
        <ul class="header__menu">
          <li class="header__menu__item">
            <a class="btn btn_contained btn_size_s" href="/login">로그인</a>
          </li>
          <li class="header__menu__item">
            <a class="btn btn_ghost btn_size_s" href="/registration">
              회원 가입
            </a>
          </li>
        </ul>
      </header>
      <div class="page">
        <h2 class="page-title">로그인</h2>
        <form id="login-form" class="form" action="/user/login" method="post" enctype="application/x-www-form-urlencoded" accept-charset="UTF-8">
          <div class="textfield textfield_size_s">
            <p class="title_textfield">아이디</p>
            <input
              class="input_textfield"
              placeholder="아이디를 입력해주세요"
              name="userId"
              autocomplete="username"
            />
          </div>
          <div class="textfield textfield_size_s">
            <p class="title_textfield">비밀번호</p>
            <input
              class="input_textfield"
              type="password"
              placeholder="비밀번호를 입력해주세요"
              name="password"
              autocomplete="current-password"
            />
          </div>
          <button
            id="login-btn"
            class="btn btn_contained btn_size_m"
            style="margin-top: 24px"
            type="submit"
          >
            로그인
          </button>
        </form>
      </div>
    </div>
  </body>

  <script>
    (function () {
      const form = document.getElementById("login-form");
      const submitBtn = document.getElementById("login-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        // 버튼 중복 클릭 방지
        submitBtn.disabled = true;

        try {
          // application/x-www-form-urlencoded 로 보내기
          const formData = new FormData(form);
          const body = new URLSearchParams(formData);

          // fetch는 기본적으로 302를 따라감(redirect: "follow")
          const res = await fetch(form.action, {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
            },
            body,
            credentials: "same-origin", // 쿠키 기반 세션이면 필요
            redirect: "follow",
          });

          if (res.status === 401) {
            alert(`로그인 실패: ${res.body}`);
            return;
          }

          // 성공: 서버가 302를 주면 fetch가 따라간 뒤
          // 최종 응답 URL(res.url)로 브라우저를 이동시켜 주소창도 업데이트
          if (res.ok) {
            // res.url은 최종 도착 URL
            window.location.assign(res.url);
            return;
          }

          // 그 외 에러 처리
          alert(`로그인에 실패했습니다. (status: ${res.status})`);
        } catch (err) {
          alert("네트워크 오류가 발생했습니다.");
        } finally {
          submitBtn.disabled = false;
        }
      });
    })();
  </script>
</html>
